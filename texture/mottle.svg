<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1000">
<!-- Soft blotches and specks of seed and dust. Shown at 1130px, a third tile size, so the cloth doesn't visibly repeat. -->
<filter id="mottle" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.0057" numOctaves="3" seed="11" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.45  0 0 0 0 0.38  0 0 0 0 0.3  1.1 0 0 0 -0.5"/></filter>
<filter id="fleck" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.68" numOctaves="1" seed="21" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.42  0 0 0 0 0.3  0 0 0 0 0.2  18 0 0 0 -13.4"/></filter>
<rect width="100%" height="100%" filter="url(#mottle)" opacity="0.11"/>
<rect width="100%" height="100%" filter="url(#fleck)" opacity="0.55"/>
</svg>
