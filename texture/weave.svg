<svg xmlns="http://www.w3.org/2000/svg" width="640" height="640">
<!-- The weave: fine horizontal weft and fainter vertical warp threads, from noise. Shown at 416px. -->
<filter id="weft" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.012 0.42" numOctaves="2" seed="2" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.34  0 0 0 0 0.28  1.6 0 0 0 -0.62"/></filter>
<filter id="warp" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency="0.42 0.016" numOctaves="2" seed="5" stitchTiles="stitch"/><feColorMatrix values="0 0 0 0 0.4  0 0 0 0 0.34  0 0 0 0 0.28  1.3 0 0 0 -0.55"/></filter>
<rect width="100%" height="100%" filter="url(#weft)" opacity="0.26"/>
<rect width="100%" height="100%" filter="url(#warp)" opacity="0.2"/>
</svg>
